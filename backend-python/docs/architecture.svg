<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:8; }
      .zone { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.5; rx:12; }
      .t1 { font-size:15px; font-weight:700; fill:#0f172a; }
      .t2 { font-size:12px; fill:#475569; }
      .t3 { font-size:11px; fill:#64748b; }
      .flow { stroke:#64748b; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .accent { fill:#eef2ff; stroke:#a5b4fc; stroke-width:1.5; }
      .green { fill:#ecfdf5; stroke:#6ee7b7; stroke-width:1.5; }
      .amber { fill:#fffbeb; stroke:#fcd34d; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="980" height="640" fill="#ffffff"/>

  <!-- 客户端区 -->
  <rect class="zone" x="20" y="30" width="200" height="580"/>
  <text class="t1" x="120" y="55" text-anchor="middle">客户端</text>
  <rect class="box" x="38" y="75" width="164" height="52" rx="8"/>
  <text class="t2" x="120" y="96" text-anchor="middle">用户端前端 (React)</text>
  <text class="t3" x="120" y="113" text-anchor="middle">分支 frontend-web</text>
  <rect class="box" x="38" y="145" width="164" height="52" rx="8"/>
  <text class="t2" x="120" y="166" text-anchor="middle">管理后台 (React)</text>
  <text class="t3" x="120" y="183" text-anchor="middle">分支 main</text>
  <rect class="box" x="38" y="215" width="164" height="52" rx="8"/>
  <text class="t2" x="120" y="236" text-anchor="middle">Java 业务后端</text>
  <text class="t3" x="120" y="253" text-anchor="middle">分支 backend-java · Spring Boot 3</text>
  <rect class="box" x="38" y="285" width="164" height="52" rx="8"/>
  <text class="t2" x="120" y="306" text-anchor="middle">知识库入库调用方</text>
  <text class="t3" x="120" y="323" text-anchor="middle">fileId + categoryId</text>

  <!-- API 服务区 -->
  <rect class="zone" x="250" y="30" width="280" height="580"/>
  <text class="t1" x="390" y="55" text-anchor="middle">AI Agent 服务（本仓库 · FastAPI :8000）</text>

  <rect class="box" x="270" y="75" width="240" height="46" rx="8"/>
  <text class="t2" x="390" y="95" text-anchor="middle">JWT 鉴权中间件</text>
  <text class="t3" x="390" y="110" text-anchor="middle">统一认证 / CORS</text>

  <rect class="box" x="270" y="140" width="240" height="86" rx="8"/>
  <text class="t2" x="390" y="162" text-anchor="middle">API 路由层</text>
  <text class="t3" x="390" y="179" text-anchor="middle">对话（SSE 流式）· 知识库 /knowledge</text>
  <text class="t3" x="390" y="195" text-anchor="middle">历史 · 执行中追加 · 任务代理 · 健康检查</text>
  <text class="t3" x="390" y="211" text-anchor="middle">软暂停 interrupt / 断点续跑</text>

  <rect class="accent" x="270" y="245" width="240" height="120" rx="8"/>
  <text class="t2" x="390" y="267" text-anchor="middle" font-weight="700">LangGraph 单节点状态图</text>
  <text class="t3" x="390" y="287" text-anchor="middle">START → common_agent_node → END</text>
  <text class="t3" x="390" y="305" text-anchor="middle">deepagents 主 Agent 派发子智能体</text>
  <text class="t3" x="390" y="321" text-anchor="middle">submit_answer 统一收尾</text>
  <text class="t3" x="390" y="337" text-anchor="middle">PG checkpointer · 历史窗口折叠</text>
  <text class="t3" x="390" y="353" text-anchor="middle">补充注入 / 停止暂停 中间件</text>

  <rect class="green" x="270" y="385" width="114" height="60" rx="8"/>
  <text class="t2" x="327" y="408" text-anchor="middle">laya 输入护栏</text>
  <text class="t3" x="327" y="424" text-anchor="middle">本地 PyTorch 小模型</text>
  <text class="t3" x="327" y="438" text-anchor="middle">只拦截不改写</text>

  <rect class="green" x="396" y="385" width="114" height="60" rx="8"/>
  <text class="t2" x="453" y="408" text-anchor="middle">OpenSandbox</text>
  <text class="t3" x="453" y="424" text-anchor="middle">会话级代码执行</text>
  <text class="t3" x="453" y="438" text-anchor="middle">MCP 动态工具</text>

  <rect class="box" x="270" y="465" width="240" height="60" rx="8"/>
  <text class="t2" x="390" y="487" text-anchor="middle">RAG 入库 Worker</text>
  <text class="t3" x="390" y="504" text-anchor="middle">读 files 表补齐 bucket/objectKey</text>
  <text class="t3" x="390" y="520" text-anchor="middle">切分 → 向量化 → 入库（审计留痕）</text>

  <rect class="amber" x="270" y="545" width="240" height="46" rx="8"/>
  <text class="t2" x="390" y="565" text-anchor="middle">OpenWiki 经验知识库</text>
  <text class="t3" x="390" y="581" text-anchor="middle">按用户隔离 ~/.openwiki/users/&lt;uid&gt;</text>

  <!-- 存储与中间件区 -->
  <rect class="zone" x="560" y="30" width="400" height="580"/>
  <text class="t1" x="760" y="55" text-anchor="middle">存储 / 中间件</text>

  <rect class="box" x="580" y="75" width="170" height="58" rx="8"/>
  <text class="t2" x="665" y="98" text-anchor="middle">Redis</text>
  <text class="t3" x="665" y="114" text-anchor="middle">LLM 缓存 · 消息流 · 暂停位</text>

  <rect class="box" x="770" y="75" width="170" height="58" rx="8"/>
  <text class="t2" x="855" y="98" text-anchor="middle">PostgreSQL</text>
  <text class="t3" x="855" y="114" text-anchor="middle">campusflow · checkpointer</text>

  <rect class="box" x="580" y="150" width="170" height="58" rx="8"/>
  <text class="t2" x="665" y="173" text-anchor="middle">MongoDB</text>
  <text class="t3" x="665" y="189" text-anchor="middle">Agent Store（会话记忆）</text>

  <rect class="box" x="770" y="150" width="170" height="58" rx="8"/>
  <text class="t2" x="855" y="173" text-anchor="middle">MinIO</text>
  <text class="t3" x="855" y="189" text-anchor="middle">知识库文件对象存储</text>

  <rect class="box" x="580" y="225" width="170" height="58" rx="8"/>
  <text class="t2" x="665" y="248" text-anchor="middle">Chroma</text>
  <text class="t3" x="665" y="264" text-anchor="middle">向量库 · RAG 检索</text>

  <rect class="box" x="770" y="225" width="170" height="58" rx="8"/>
  <text class="t2" x="855" y="248" text-anchor="middle">RabbitMQ</text>
  <text class="t3" x="855" y="264" text-anchor="middle">与 Java 端任务协同</text>

  <rect class="box" x="580" y="300" width="170" height="58" rx="8"/>
  <text class="t2" x="665" y="323" text-anchor="middle">MySQL</text>
  <text class="t3" x="665" y="339" text-anchor="middle">campus_flow（Java 共库）</text>

  <rect class="amber" x="770" y="300" width="170" height="58" rx="8"/>
  <text class="t2" x="855" y="323" text-anchor="middle">LLM 网关</text>
  <text class="t3" x="855" y="339" text-anchor="middle">OpenAI 兼容协议</text>

  <!-- 知识点说明区 -->
  <rect class="box" x="580" y="395" width="360" height="196" rx="8"/>
  <text class="t2" x="600" y="420" font-weight="700">关键设计</text>
  <text class="t3" x="600" y="442">· 软暂停：模型调用边界 interrupt，干净断点、可续跑</text>
  <text class="t3" x="600" y="460">· 执行中追加：用户补充消息在模型调用前软注入</text>
  <text class="t3" x="600" y="478">· 历史窗口：近 N 轮原文 + 更早轮次滚动摘要</text>
  <text class="t3" x="600" y="496">· 结构化输出强制关思考模式（避免网关 400）</text>
  <text class="t3" x="600" y="514">· 附件正文不进消息流：只落盘、喂路径</text>
  <text class="t3" x="600" y="532">· 护栏独立模型：输入与文档注入分开训练</text>
  <text class="t3" x="600" y="550">· 辅助 LLM 步骤只降级不中断主流程</text>
  <text class="t3" x="600" y="568">· 外部依赖全部惰性单例 + getter 构造</text>

  <!-- 连线 -->
  <line class="flow" x1="202" y1="101" x2="264" y2="96"/>
  <line class="flow" x1="202" y1="171" x2="264" y2="163"/>
  <line class="flow" x1="202" y1="241" x2="264" y2="285"/>
  <line class="flow" x1="390" y1="121" x2="390" y2="134"/>
  <line class="flow" x1="390" y1="226" x2="390" y2="239"/>
  <line class="flow" x1="665" y1="133" x2="665" y2="144"/>
  <line class="flow" x1="855" y1="133" x2="855" y2="144"/>
  <line class="flow" x1="665" y1="208" x2="665" y2="219"/>
  <line class="flow" x1="855" y1="208" x2="855" y2="219"/>
  <line class="flow" x1="510" y1="300" x2="574" y2="245"/>
  <line class="flow" x1="510" y1="420" x2="574" y2="250"/>
  <line class="flow" x1="510" y1="490" x2="770" y2="240"/>
  <line class="flow" x1="510" y1="300" x2="580" y2="110"/>
  <line class="flow" x1="327" y1="379" x2="327" y2="371" opacity="0"/>
</svg>
